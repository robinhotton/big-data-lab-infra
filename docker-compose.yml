# Bloc de configuration commun aux 3 services Airflow
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Conn string construite depuis les vars Postgres du .env (pas de secret en clair)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Silence les SyntaxWarning du SDK Azure (azure-synapse-artifacts, préinstallé
    # dans l'image Airflow, contient des regex \d invalides sous Python 3.12).
    # On filtre uniquement SyntaxWarning — les autres warnings (Deprecation, etc.)
    # restent visibles pour signaler de vrais problèmes dans notre code.
    PYTHONWARNINGS: "ignore::SyntaxWarning"
    # `/opt/airflow` permet `from src.config import ...` (DAG lab).
    # `/opt/airflow/src` permet `from config import ...` (même code importé « à plat »,
    # aligné sur CODE/ du cours et l'exo8 — les deux contextes tournent le même fichier).
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    # --- Connexion MinIO lue par airflow/src/config.py ---
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?voir .env.example}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?voir .env.example}
    MINIO_BUCKET: data-lake
    # Connexion Airflow déclarée (conn_id="minio_default") — utilisée par les
    # S3Hook du DAG d'exemple. Format JSON (l'URI aws://...?endpoint_url= n'est
    # pas valide en Airflow 2.9) : credentials + endpoint dans les extras.
    AIRFLOW_CONN_MINIO_DEFAULT: '{"conn_type":"aws","host":"http://minio:9000","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":"{\"endpoint_url\":\"http://minio:9000\"}"}'
    # Remote logging : logs des DAG runs envoyés vers MinIO (bucket data-lake).
    # Réutilise la connexion minio_default — zéro config UI. Conserve les logs
    # même si le conteneur est recréé (cloud-native, FS éphémère).
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://data-lake/airflow-logs/"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "minio_default"
    # Dépendances Python installées au démarrage (pas de build d'image custom).
    # Toutes pinnées pour une stack reproductible.
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3==1.34.162 apache-airflow-providers-amazon==8.10.0 pandas==2.2.2"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts:ro
    # Données + logs Airflow en volumes nommés (pas de bind mount) :
    # évite les "Permission denied" quand l'UID airflow (50000) du conteneur
    # ne matche pas l'UID du dossier hôte (notamment sur Linux natif).
    - airflow_data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── STOCKAGE ──────────────────────────────────────────────────────────────

  # Stockage objet S3-compatible — API sur :9000, console web sur :9001
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: lab-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?voir .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?voir .env.example}
      # Clé KMS locale — active le chiffrement SSE-S3 (AES256) sans service externe
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?voir .env.example}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crée le bucket data-lake + lifecycle au premier démarrage (one-shot)
  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: lab-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?voir .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?voir .env.example}
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - lab-net

  # Charge les datasets de formation dans MinIO (one-shot).
  # Activé par le profile "datasets" (COMPOSE_PROFILES=datasets dans .env).
  # Désactivé ce profil pour démarrer la stack sans charger les données.
  datasets-init:
    image: python:3.11.10-slim
    container_name: lab-datasets-init
    profiles: ["datasets"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/datasets-init.sh"]
    environment:
      # setup_datasets.py lit MINIO_ROOT_USER/PASSWORD/BUCKET et SKIP_TAXI_FULL
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?voir .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?voir .env.example}
      MINIO_BUCKET: data-lake
      SKIP_TAXI_FULL: ${SKIP_TAXI_FULL:-false}
    volumes:
      - ./setup_datasets.py:/app/setup_datasets.py:ro
      - ./scripts:/scripts:ro
    working_dir: /app
    networks:
      - lab-net

  # ── ORCHESTRATION ─────────────────────────────────────────────────────────

  # Base de données interne Airflow
  postgres:
    image: postgres:16.4-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?voir .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialise la base Airflow et crée l'utilisateur admin (one-shot)
  airflow-init:
    <<: *airflow-common
    container_name: lab-airflow-init
    restart: on-failure
    # Tourne en root pour pouvoir chown le volume airflow_data (root au départ)
    # vers l'UID airflow (50000) — webserver/scheduler tournent sous 50000.
    user: "0:0"
    networks:
      - lab-net
    entrypoint: ["/bin/bash", "/opt/airflow/scripts/airflow-init.sh"]
    # `environment:` au niveau service remplace (ne fusionne pas) celui de l'anchor :
    # il faut donc reprendre ici toutes les vars de x-airflow-common + les credentials
    # admin Airflow (spécifiques à init).
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONWARNINGS: "ignore::SyntaxWarning"
      PYTHONPATH: /opt/airflow:/opt/airflow/src
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?voir .env.example}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?voir .env.example}
      MINIO_BUCKET: data-lake
      AIRFLOW_CONN_MINIO_DEFAULT: '{"conn_type":"aws","host":"http://minio:9000","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":"{\"endpoint_url\":\"http://minio:9000\"}"}'
      AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://data-lake/airflow-logs/"
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "minio_default"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?voir .env.example}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?voir .env.example}

  airflow-webserver:
    <<: *airflow-common
    container_name: lab-airflow-webserver
    networks:
      - lab-net
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lab-airflow-scheduler
    networks:
      - lab-net
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  # Réseau nommé explicitement — indépendant du nom du dossier parent
  # (sinon Docker nomme "<dossier>_default", ce qui casse les références
  # `docker run --network` après un renommage du dépôt).
  lab-net:
    name: lab-net

volumes:
  minio_data:
  postgres_data:
  airflow_data:
  airflow_logs:
