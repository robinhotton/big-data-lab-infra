# Configuration du projet pour les outils de développement (lint, tests).
# Ce fichier n'affecte pas le conteneur Docker — il sert uniquement pour
# l'exécution locale hors Docker (lint / tests / éditeur).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]
# Les DAGs importent après sys.path manipulation (E402 attendu)
per-file-ignores = { "airflow/dags/*.py" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
