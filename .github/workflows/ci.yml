# CI — lint, tests unitaires et smoke test de la stack lab.
#
# Deux jobs indépendants :
#   - lint-test     : rapide, sans Docker (ruff + pytest, unitaires et moto)
#   - compose-smoke : démarre la stack et vérifie qu'elle répond (le vrai test)
#
# Un job cron mensuel vérifie que les images pinées sont toujours
# téléchargeables — c'est exactement la panne qui a mis la stack hors service
# (images upstream supprimées) et que rien ne détectait.
name: CI

on:
  push:
    branches: [main, "v2/**", "v3/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # mensuel — vérifie la disponibilité des images (« supply chain check »)
    - cron: "17 6 3 * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest (métier + contrat des DAGs)
        run: pytest -v --tb=short --junitxml=reports/pytest.xml

      - name: Rapport de lint et de tests (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-test-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  compose-smoke:
    name: Smoke test de la stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer la stack et vérifier les healthchecks
        run: ./scripts/smoke-test.sh

      - name: Prouver que les images sont téléchargeables (supply chain)
        if: always()
        run: |
          echo "▶ Images pinées dans docker-compose.yml :"
          grep -E '^\s+image:' docker-compose.yml
          echo ""
          for img in $(grep -E '^\s+image:' docker-compose.yml | awk '{print $2}' | sort -u); do
            echo "→ docker pull $img"
            docker pull "$img"
          done

      - name: Collecter les logs de la stack
        if: always()
        run: |
          mkdir -p reports/stack
          docker compose -p lab-smoke --env-file .env \
            -f docker-compose.yml -f docker-compose.smoke.yml \
            ps -a > reports/stack/ps.txt 2>&1 || true
          docker compose -p lab-smoke --env-file .env \
            -f docker-compose.yml -f docker-compose.smoke.yml \
            logs --no-color > reports/stack/logs.txt 2>&1 || true
          ./scripts/stack-status.sh > reports/stack/status.txt 2>&1 || true

      - name: Logs de la stack (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: reports/stack/
          retention-days: 14
          if-no-files-found: ignore
